
name: Build CARB CLIENT

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CARB CLIENT
        run: gradle build

      - name: Upload CARB CLIENT JAR
        uses: actions/upload-artifact@v4
        with:
          name: CARB-CLIENT-Fabric-1.21.4
          path: build/libs/*.jar
